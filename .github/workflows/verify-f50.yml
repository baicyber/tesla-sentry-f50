name: Verify F50 installation
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Viewer module and encoder checks
        run: |
          export TSF_CACHE="$RUNNER_TEMP/tsf-cache" TSF_ARCHIVE="$RUNNER_TEMP/tsf-archive"
          export TSF_AUTH_FILE="$RUNNER_TEMP/tsf-auth.conf" TSF_SETTINGS="$RUNNER_TEMP/tsf-settings.json"
          python3 -B sentry-viewer.py --ota-check
          ffmpeg -v error -f lavfi -i color=size=64x64:rate=1 -frames:v 1 -c:v libx264 -f null -
